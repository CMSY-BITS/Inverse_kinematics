[project]
name = "jepa-ik"
version = "0.1.0"
description = "V-JEPA 2 visual inverse kinematics for the dVRK PSM: evaluation plan, kinematics, planner, UDE/MMD/Jev, sim scaffold."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Top-level importable packages. sim/'s own ROS2 packaging (ament_python)
# is separate from this pyproject — see README.md. `blender` IS included
# here even though blender/*.py's own entry points only run inside
# Blender/BlenderProc: sim/ros2_ws/src/surg_sim/surg_sim/psm_urdf.py (a
# normal ROS 2 node module, not a Blender script) imports from it too, and
# needs it resolvable via this package's normal pip install -- not every
# consumer of blender/ has the Path(__file__)-based sys.path bootstrap
# that blender/scene_gen.py and blender/blenderproc_rerender.py use for
# being invoked directly by Blender/BlenderProc.
py-modules = []

[tool.setuptools.packages.find]
include = ["kinematics*", "models*", "supervisor*", "data*", "eval*", "blender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
